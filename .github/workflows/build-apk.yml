name: Build APK

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Gradle variant to assemble (output APK is uploaded as an artifact)."
        required: true
        default: "PlayDebug"
        type: choice
        options:
          - PlayDebug
          - PlayRelease
          - FreeDebug
          - FreeRelease

jobs:
  build:
    name: assemble${{ inputs.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties

      - name: Create temporary release keystore
        if: endsWith(inputs.variant, 'Release')
        run: keytool -noprompt -genkey -v -keystore "app/keystore" -alias alias -storepass password -keypass password -keyalg RSA -validity 10 -dname "CN=antennapod.org, OU=dummy, O=dummy, L=dummy, S=dummy, C=US"

      - name: Assemble APK
        run: ./gradlew assemble${{ inputs.variant }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.variant }}
          path: app/build/outputs/apk/**/*.apk
